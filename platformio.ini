; PlatformIO Project Configuration File
; SimpleFaceMe - LD2450 Radar Target Tracking with Servos
;
; Two build configurations:
;   - single_servo: 1x MG996R servo (UNTESTED - requires calibration)
;   - dual_servo:   2x 20Kg servos (TESTED - from servo_validation)
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = unified

[env:single_servo]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = log2file

; Library dependencies - REQUIRED, do not write custom implementations
lib_deps = 
    https://github.com/RBEGamer/LD2450.git
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    Wire
    SPI

; Build flags - all configuration here per platformio-practices
build_flags = 
    ; === Hardware Pin Configuration ===
    ; Debug Serial (USB CDC on ESP32-S3, no GPIO pins needed)
    ; Uses built-in USB peripheral for Serial output
    -D DEBUG_SERIAL_BAUD=115200
    ; LD2450 UART pins (UART1 on ESP32-S3)
    -D LD2450_UART_NUM=1
    -D LD2450_TX_PIN=17
    -D LD2450_RX_PIN=18
    ; PCA9685 I2C pins (Hardware I2C)
    -D PCA9685_SDA_PIN=8
    -D PCA9685_SCL_PIN=9
    
    ; === Geometry Configuration (mm) ===
    ; Sensor position (origin)
    -D SENSOR_OFFSET_X=0
    -D SENSOR_OFFSET_Y=0
    ; Single servo position (5cm behind sensor)
    -D SERVO_OFFSET_X=0
    -D SERVO_OFFSET_Y=-50
    
    ; === Hardware Configuration ===
    -D NUM_SERVOS=1
    -D LD2450_BAUD=256000
    -D PCA9685_ADDR=0x40
    -D SERVO_FREQ=50
    
    ; === LD2450 Coordinate Transformation ===
    ; Adjust sensor coordinate frame to match desired system
    -D LD2450_FLIP_X=1        ; 1=flip X axis (negate), 0=no flip
    -D LD2450_FLIP_Y=0        ; 1=flip Y axis (negate), 0=no flip
    -D LD2450_OFFSET_X=0      ; Add offset to X (mm)
    -D LD2450_OFFSET_Y=0      ; Add offset to Y (mm)
    
    ; === Servo Calibration (microseconds) ===
    ; MG996R - UNTESTED, conservative defaults
    ; Adjust these during hardware testing
    -D PULSE_MIN_US=500
    -D PULSE_CENTER_US=1500
    -D PULSE_MAX_US=2500
    
    ; === Behavior Parameters ===
    -D SERVO_UPDATE_PERIOD_MS=100
    -D TARGET_TIMEOUT_MS=5000
    -D DEBUG_VERBOSE=0
    
    ; === Debug Categories (0=disabled, 1=enabled) ===
    -D DEBUG_SYSTEM=1
    -D DEBUG_SENSOR=0
    -D DEBUG_MOTOR=0
    -D DEBUG_GEOMETRY=0
    -D TEST_MODE=0

[env:unified]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_filters = log2file

; Library dependencies
lib_deps = 
    https://github.com/RBEGamer/LD2450.git
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    Wire
    SPI

; Build flags - Runtime mode selection via GPIO21
build_flags = 
    ; === Mode Selection ===
    -D MODE_SELECT_PIN=21     ; Ground = dual servo, Float (pullup) = single servo
    -D RUNTIME_MODE_SELECT=1  ; Enable runtime configuration
    
    ; === Hardware Pin Configuration ===
    -D DEBUG_SERIAL_BAUD=115200
    -D LD2450_UART_NUM=1
    -D LD2450_TX_PIN=17
    -D LD2450_RX_PIN=18
    -D PCA9685_SDA_PIN=8
    -D PCA9685_SCL_PIN=9
    
    ; === Sensor Geometry (mm) - always at origin ===
    -D SENSOR_OFFSET_X=0
    -D SENSOR_OFFSET_Y=0
    
    ; === Single Servo Geometry (mm) ===
    -D SINGLE_SERVO_OFFSET_X=0
    -D SINGLE_SERVO_OFFSET_Y=-50
    
    ; === Dual Servo Geometry (mm) ===
    -D DUAL_SERVO1_OFFSET_X=-150
    -D DUAL_SERVO1_OFFSET_Y=-100
    -D DUAL_SERVO2_OFFSET_X=150
    -D DUAL_SERVO2_OFFSET_Y=-100
    
    ; === Hardware Configuration ===
    -D LD2450_BAUD=256000
    -D PCA9685_ADDR=0x40
    -D SERVO_FREQ=50
    
    ; === LD2450 Coordinate Transformation ===
    -D LD2450_FLIP_X=1
    -D LD2450_FLIP_Y=0
    -D LD2450_OFFSET_X=0
    -D LD2450_OFFSET_Y=0
    
    ; === Servo Calibration (microseconds) ===
    -D PULSE_MIN_US=500
    -D PULSE_CENTER_US=1500
    -D PULSE_MAX_US=2500
    
    ; === Behavior Parameters ===
    -D SERVO_UPDATE_PERIOD_MS=100
    -D TARGET_TIMEOUT_MS=5000
    -D DEBUG_VERBOSE=0
    
    ; === Debug Categories ===
    -D DEBUG_SYSTEM=1
    -D DEBUG_SENSOR=0
    -D DEBUG_MOTOR=0
    -D DEBUG_GEOMETRY=0
    -D TEST_MODE=0

